# 설비보전 AI 학습 환경 (uv)
#   처음:  uv sync
#   예:    uv run python src/train_klue.py   (실행 순서는 README.md 참고)
[project]
name = "smartline-maintenance"
version = "5.0.0"
description = "SMART LINE 설비보전 AI: 고장 보고 문장 → 담당 분야 · 조치 시점 분류 (TF-IDF · BiLSTM · KLUE 앙상블)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "kiwipiepy>=0.18",
    "tensorflow>=2.16",
    "torch>=2.3",
    "transformers>=4.44",
    "sentence-transformers>=3.0",
]

[tool.uv]
package = false
